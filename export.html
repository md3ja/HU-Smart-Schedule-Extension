<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقرير جدول المواد — الجامعة الهاشمية</title>
  <style>
    :root {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #18202a;
      background: #08090c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #08090c;
      color: #1a202c;
      font-size: 13px;
      line-height: 1.5;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 28px 32px;
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.38);
      border: 1px solid #2a2d35;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #000000;
      padding-bottom: 16px;
      margin-bottom: 24px;
      position: relative;
    }
    .header-bar::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: 0;
      width: 48px;
      height: 2px;
      background: linear-gradient(to left, #ca8a04 33%, #db2777 33% 66%, #0d9488 66%);
    }
    .header-title h1 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #000000;
      font-weight: 800;
    }
    .header-title p {
      margin: 0;
      color: #4b5563;
      font-size: 13px;
    }
    .header-meta {
      text-align: left;
      font-size: 12px;
      color: #4b5563;
    }
    .header-meta b { color: #111827; }

    .no-print {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      padding: 14px 18px;
      background: #111319;
      border: 1px solid #2d3340;
      border-radius: 10px;
      align-items: center;
      justify-content: space-between;
      color: #f4f4f5;
    }
    .btn {
      min-height: 38px;
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .btn-primary {
      background: #F1EE0D;
      color: #000000;
      font-weight: 800;
    }
    .btn-primary:hover {
      background: #dcd90a;
    }
    .btn-secondary {
      background: #1b1e25;
      color: #f4f4f5;
      border: 1px solid #3b414d;
    }
    .btn-secondary:hover {
      background: #262b34;
      border-color: #596273;
    }

    .report-section {
      margin-bottom: 36px;
    }
    .section-heading {
      font-size: 17px;
      color: #000000;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
      margin: 0 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #edf2f7;
      color: #4a5568;
    }
    .badge-blue { background: #ebf4ff; color: #2b6cb0; }
    .badge-green { background: #e6fffa; color: #234e52; }
    .badge-warn { background: #feebc8; color: #7b341e; }
    .badge-remote { background: #e9d8fd; color: #44337a; }
    .badge-neutral { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    .print-unscheduled-bar {
      margin: 8px 0;
      padding: 6px 12px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11px;
      color: #1e3a63;
      line-height: 1.4;
    }
    .print-exceptions-bar {
      margin: 8px 0;
      padding: 6px 12px;
      background: #fffaf0;
      border: 1px solid #feebc8;
      border-right: 4px solid #dd6b20;
      border-radius: 6px;
      font-size: 11px;
      color: #7b341e;
      line-height: 1.5;
    }
    .print-omitted-bar {
      margin: 8px 0;
      padding: 6px 12px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-right: 4px solid #6366f1;
      border-radius: 6px;
      font-size: 11px;
      color: #3730a3;
      line-height: 1.5;
    }
    .print-exception-banner {
      margin: 8px 0 12px;
      padding: 8px 14px;
      background: #fffaf0;
      border: 1px solid #feebc8;
      border-right: 4px solid #dd6b20;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #7b341e;
      line-height: 1.5;
    }
    .exception-note {
      display: inline-block;
      margin-top: 2px;
      font-size: 11px;
      color: #c05621;
      font-weight: 600;
    }
    .timetable-meeting.meeting-exception {
      outline: 1.5px dashed #dd6b20;
      outline-offset: -1.5px;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 20px;
      font-size: 12px;
    }
    table.data-table th {
      background: #f7fafc;
      color: #2d3748;
      font-weight: 700;
      text-align: right;
      padding: 9px 10px;
      border: 1px solid #e2e8f0;
    }
    table.data-table td {
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      vertical-align: middle;
    }
    table.data-table tr:nth-child(even) {
      background: #fafbfc;
    }
    .export-detail-location {
      margin-top: 3px;
      font-size: 11px;
      color: #4a5568;
      line-height: 1.35;
    }

    /* Timetable Print Grid */
    .timetable-wrap {
      margin: 16px 0 24px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .timetable-grid {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .timetable-grid th {
      background: #edf2f7;
      color: #2d3748;
      padding: 8px 4px;
      font-size: 12px;
      border: 1px solid #cbd5e0;
      text-align: center;
    }
    .timetable-grid th.time-col { width: 70px; }
    .timetable-grid td {
      border: 1px solid #e2e8f0;
      height: 38px;
      padding: 2px 4px;
      vertical-align: top;
      position: relative;
    }
    .timetable-grid td.time-cell {
      background: #f7fafc;
      font-size: 11px;
      color: #4a5568;
      text-align: center;
      font-weight: 600;
    }
    .timetable-meeting {
      position: absolute;
      inset-inline: 1px;
      overflow: hidden;
      display: block;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 10px;
      line-height: 1.3;
      border-right: 3.5px solid var(--border, #0d9488);
      background: var(--bg, #f0fdfa);
      color: var(--text, #0f766e);
      margin-bottom: 2px;
      box-sizing: border-box;
    }
    .timetable-meeting.blended {
      border-right-style: dashed !important;
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 6px,
        rgba(0, 0, 0, 0.04) 6px,
        rgba(0, 0, 0, 0.04) 12px
      );
    }
    .timetable-meeting.remote {
      border-right-style: dotted !important;
      background-image: radial-gradient(
        rgba(0, 0, 0, 0.06) 1.5px,
        transparent 1.5px
      );
      background-size: 8px 8px;
    }
    .export-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 0 4px;
      border-radius: 3px;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1.3;
    }
    .export-badge.badge-blended {
      background: rgba(14, 165, 233, 0.15);
      color: #0369a1;
      border: 1px solid rgba(14, 165, 233, 0.35);
    }
    .export-badge.badge-remote {
      background: rgba(124, 58, 237, 0.12);
      color: #6d28d9;
      border: 1px solid rgba(124, 58, 237, 0.35);
    }
    .meeting-room {
      display: inline-block;
      padding: 0 4px;
      background: rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 3px;
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1.25;
      color: inherit;
      white-space: nowrap;
      max-width: 100%;
    }
    .timetable-meeting.meeting-compact .meeting-room {
      display: none !important;
    }
    td.course-label-cell {
      border-right: 4px solid var(--border) !important;
    }
    .timetable-meeting { display: flex; flex-direction: column; gap: 1px; }
    .timetable-meeting .meeting-title { font-size: 10.5px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; flex: none; }
    .timetable-meeting .meeting-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 9.5px; font-weight: 600; flex: none; }
    .timetable-meeting .meeting-instructor { font-size: 8.5px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; }
    .timetable-meeting .meeting-time-row { font-size: 9.5px; font-weight: 600; margin-top: auto; flex: none; }
    .timetable-meeting.meeting-medium { padding: 3px 6px; }
    .timetable-meeting.meeting-compact { padding: 1px 4px; gap: 0; line-height: 1.1; }
    .timetable-meeting.meeting-compact .meeting-title { font-size: 9px; line-height: 1.1; }
    .timetable-meeting.meeting-compact .meeting-meta { font-size: 8px; gap: 0 3px; line-height: 1.15; }
    .timetable-meeting.meeting-compact .meeting-instructor { font-size: 8px; line-height: 1.1; }
    .timetable-meeting.meeting-compact .export-badge { font-size: 7px; padding: 0 2px; line-height: 1.1; }
    .timetable-wrap { --print-calendar-days: 5; }
    .timetable-wrap.has-saturday { --print-calendar-days: 6; }
    .print-week-header, .print-week-body { display: grid; grid-template-columns: 50px repeat(var(--print-calendar-days, 5), minmax(0, 1fr)); }
    .print-week-header { background: #edf2f7; text-align: center; font-weight: 700; }
    .print-week-header > span { padding: 8px 2px; }
    .print-week-day, .print-time-axis { position: relative; min-width: 0; border-inline-start: 1px solid #e2e8f0; }
    .print-week-day {
      background-image:
        linear-gradient(to bottom, #cbd5e1 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.6) 1px, transparent 1px);
      background-size: 100% var(--hour-height), 100% calc(var(--hour-height) / 2);
      background-repeat: repeat-y;
    }
    .print-time-axis > span {
      position: absolute;
      inset-inline: 0;
      text-align: center;
      transform: translateY(-50%);
      user-select: none;
      line-height: 1;
    }
    .print-time-axis > span.print-tick-major {
      font-size: 9.5px;
      font-weight: 700;
      color: #1e293b;
    }
    .print-time-axis > span.print-tick-minor {
      font-size: 8px;
      font-weight: 500;
      color: #64748b;
    }
    .print-time-axis > span.first-tick {
      transform: translateY(0);
    }
    .print-time-axis > span.last-tick {
      transform: translateY(-100%);
    }

    .schedule-card-print {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      background: #fff;
      page-break-inside: auto;
      break-inside: auto;
    }
    .schedule-meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .daily-breaks-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
      font-size: 12px;
      color: #4a5568;
    }
    .break-pill {
      background: #edf2f7;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      display: inline-block;
      line-height: 1.4;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .break-pill.break-pill-off {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #475569;
      font-weight: 500;
    }
    .break-pill.break-pill-solid {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
      font-weight: 600;
    }
    .break-pill.break-pill-remote {
      background: #f5f3ff;
      border-color: #ddd6fe;
      color: #5b21b6;
      font-weight: 600;
    }
    .break-pill.break-pill-warn,
    .break-pill.warn {
      background: #fef3c7;
      border-color: #fde68a;
      color: #92400e;
      font-weight: 700;
    }

    .course-color-0 { --border: #0d9488; --bg: #f0fdfa; --text: #0f766e; }
    .course-color-1 { --border: #7c3aed; --bg: #f5f3ff; --text: #6d28d9; }
    .course-color-2 { --border: #d97706; --bg: #fffbeb; --text: #b45309; }
    .course-color-3 { --border: #059669; --bg: #ecfdf5; --text: #047857; }
    .course-color-4 { --border: #e11d48; --bg: #fff1f2; --text: #be123c; }
    .course-color-5 { --border: #4f46e5; --bg: #eef2ff; --text: #4338ca; }
    .course-color-6 { --border: #ea580c; --bg: #fff7ed; --text: #c2410c; }
    .course-color-7 { --border: #0284c7; --bg: #f0f9ff; --text: #0369a1; }
    .course-color-8 { --border: #c026d3; --bg: #fdf4ff; --text: #a21caf; }
    .course-color-9 { --border: #65a30d; --bg: #f7fee7; --text: #4d7c0f; }
    .course-color-10 { --border: #475569; --bg: #f8fafc; --text: #334155; }
    .course-color-11 { --border: #dc2626; --bg: #fef2f2; --text: #b91c1c; }

    @media print {
      html,
      :root,
      body {
        background: #ffffff !important;
        background-color: #ffffff !important;
      }
      body { padding: 0; font-size: 10.5px; }
      .container { box-shadow: none !important; border: none !important; padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
      .page-break { page-break-before: always; break-before: page; }
      @page { size: A4 portrait; margin: 10mm 10mm; }

      .header-bar {
        border-bottom: 2px solid #000000;
        padding-bottom: 4px;
        margin-bottom: 6px;
      }
      .header-title h1 { font-size: 15px; margin: 0 0 1px; }
      .header-title p { font-size: 10px; margin: 0; }
      .header-meta { font-size: 10.5px; }

      .report-section { margin-bottom: 8px; }
      .section-heading {
        margin: 0 0 6px;
        padding-bottom: 3px;
        font-size: 12.5px;
      }

      .schedule-card-print {
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 10px;
        page-break-inside: auto;
        break-inside: auto;
      }
      .schedule-card-print > div:first-child {
        margin-bottom: 4px !important;
      }
      .schedule-card-print h3 {
        font-size: 14px !important;
      }
      .schedule-meta-bar { margin-bottom: 4px; gap: 4px; }
      .daily-breaks-list { margin: 2px 0 5px; font-size: 10px; gap: 3px; }
      .break-pill {
        padding: 1px 5px;
        font-size: 9.5px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .break-pill.break-pill-off {
        background: #f1f5f9 !important;
        border-color: #cbd5e1 !important;
        color: #475569 !important;
      }
      .break-pill.break-pill-solid {
        background: #ecfdf5 !important;
        border-color: #a7f3d0 !important;
        color: #065f46 !important;
      }
      .break-pill.break-pill-remote {
        background: #f5f3ff !important;
        border-color: #ddd6fe !important;
        color: #5b21b6 !important;
      }
      .break-pill.break-pill-warn,
      .break-pill.warn {
        background: #fef3c7 !important;
        border-color: #fde68a !important;
        color: #92400e !important;
      }
      .badge { padding: 1.5px 5px; font-size: 9.5px; }

      .print-unscheduled-bar,
      .print-exceptions-bar,
      .print-omitted-bar,
      .print-exception-banner {
        margin: 3px 0 !important;
        padding: 3px 8px !important;
        font-size: 9.5px !important;
      }

      .timetable-wrap {
        margin: 4px 0 6px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .print-week-header > span { padding: 3px 2px; font-size: 10px; }

      table.data-table {
        margin: 4px 0 2px;
        font-size: 9.5px;
        line-height: 1.25;
        page-break-inside: auto;
        break-inside: auto;
        orphans: 2;
        widows: 2;
      }
      table.data-table th { padding: 3.5px 5px; font-size: 9.5px; }
      table.data-table td { padding: 2.5px 5px; }
      table.data-table tr {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .export-detail-location {
        margin-top: 1px;
        font-size: 8.5px;
        color: #4a5568;
        line-height: 1.2;
      }
      .meeting-room {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        background: rgba(0, 0, 0, 0.05) !important;
        border-color: rgba(0, 0, 0, 0.15) !important;
      }
      .timetable-meeting.meeting-compact .meeting-room {
        display: none !important;
      }

      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="no-print">
      <div>
        <span style="font-weight:700;font-size:14px;">📄 معاينة التقرير للطباعة أو الحفظ كـ PDF</span>
        <div style="font-size:12px;color:#a1a1aa;margin-top:2px;">يمكنك اختيار "Save as PDF" من نافذة الطباعة لحفظ التقرير كملف PDF.</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn btn-primary" id="printReport">🖨️ طباعة الآن / حفظ كـ PDF</button>
        <button type="button" class="btn btn-secondary" id="closeReport">إغلاق</button>
      </div>
    </div>

    <header class="header-bar">
      <div class="header-title">
        <h1>الجامعة الهاشمية — Hashemite University</h1>
        <p>نظام الجداول الذكي — HU Smart Schedule</p>
      </div>
      <div class="header-meta">
        <div><b>الفصل:</b> <span id="metaTerm">—</span></div>
        <div><b>تاريخ التقرير:</b> <span id="metaDate" dir="ltr">—</span></div>
        <div><b>نوع التقرير:</b> <span id="metaType">—</span></div>
      </div>
    </header>

    <div id="reportContent">
      <div style="text-align:center;padding:40px;color:#718096;">جاري تحميل بيانات التقرير...</div>
    </div>
  </div>

  <script src="export.js"></script>
</body>
</html>
