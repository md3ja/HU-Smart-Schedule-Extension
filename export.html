<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقرير جدول المواد — الجامعة الهاشمية</title>
  <style>
    :root {
      font-family: Arial, "Segoe UI", Tahoma, sans-serif;
      color: #18202a;
      background: #f5f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fa;
      color: #1a202c;
      font-size: 13px;
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      padding: 28px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #2b4c7e;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .header-title h1 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #1e3a63;
    }
    .header-title p {
      margin: 0;
      color: #5a6a7e;
      font-size: 13px;
    }
    .header-meta {
      text-align: left;
      font-size: 12px;
      color: #4a5568;
    }
    .header-meta b { color: #1a202c; }

    .no-print {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #eef4fc;
      border: 1px solid #cbdcf2;
      border-radius: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: #1e3a63; color: #fff; }
    .btn-primary:hover { background: #142845; }
    .btn-secondary { background: #e2e8f0; color: #2d3748; }

    .report-section {
      margin-bottom: 36px;
    }
    .section-heading {
      font-size: 17px;
      color: #1e3a63;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
      margin: 0 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #edf2f7;
      color: #4a5568;
    }
    .badge-blue { background: #ebf4ff; color: #2b6cb0; }
    .badge-green { background: #e6fffa; color: #234e52; }
    .badge-warn { background: #feebc8; color: #7b341e; }
    .badge-remote { background: #e9d8fd; color: #44337a; }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 20px;
      font-size: 12px;
    }
    table.data-table th {
      background: #f7fafc;
      color: #2d3748;
      font-weight: 700;
      text-align: right;
      padding: 9px 10px;
      border: 1px solid #e2e8f0;
    }
    table.data-table td {
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      vertical-align: middle;
    }
    table.data-table tr:nth-child(even) {
      background: #fafbfc;
    }

    /* Timetable Print Grid */
    .timetable-wrap {
      margin: 16px 0 24px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .timetable-grid {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .timetable-grid th {
      background: #edf2f7;
      color: #2d3748;
      padding: 8px 4px;
      font-size: 12px;
      border: 1px solid #cbd5e0;
      text-align: center;
    }
    .timetable-grid th.time-col { width: 70px; }
    .timetable-grid td {
      border: 1px solid #e2e8f0;
      height: 38px;
      padding: 2px 4px;
      vertical-align: top;
      position: relative;
    }
    .timetable-grid td.time-cell {
      background: #f7fafc;
      font-size: 11px;
      color: #4a5568;
      text-align: center;
      font-weight: 600;
    }
    .timetable-meeting {
      position: absolute;
      inset-inline: 1px;
      overflow: hidden;
      display: block;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 10px;
      line-height: 1.3;
      border-right: 3px solid #3182ce;
      background: #ebf8ff;
      color: #2b6cb0;
      margin-bottom: 2px;
    }
    .timetable-meeting.remote {
      border-right-style: dashed;
      background: #faf5ff;
      color: #553c9e;
      border-right-color: #805ad5;
    }
    .timetable-meeting b { display: block; font-size: 11px; }
    .print-week-header, .print-week-body { display: grid; grid-template-columns: 50px repeat(5, minmax(0, 1fr)); }
    .print-week-header { background: #edf2f7; text-align: center; font-weight: 700; }
    .print-week-header > span { padding: 8px 2px; }
    .print-week-day, .print-time-axis { position: relative; min-width: 0; border-inline-start: 1px solid #e2e8f0; }
    .print-week-day { background: repeating-linear-gradient(to bottom, #e2e8f0 0 1px, transparent 1px var(--hour-height)); }
    .print-time-axis > span { position: absolute; inset-inline: 0; text-align: center; font-size: 10px; }

    .schedule-card-print {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      background: #fff;
      page-break-inside: auto;
      break-inside: auto;
    }
    .schedule-meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .daily-breaks-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
      font-size: 12px;
      color: #4a5568;
    }
    .break-pill {
      background: #edf2f7;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
    }
    .break-pill.warn { background: #feebc8; color: #7b341e; font-weight: 700; }

    .course-color-0 { --border: #3182ce; --bg: #ebf8ff; --text: #2b6cb0; }
    .course-color-1 { --border: #38a169; --bg: #f0fff4; --text: #22543d; }
    .course-color-2 { --border: #805ad5; --bg: #faf5ff; --text: #44337a; }
    .course-color-3 { --border: #dd6b20; --bg: #fffaf0; --text: #7b341e; }
    .course-color-4 { --border: #319795; --bg: #e6fffa; --text: #234e52; }
    .course-color-5 { --border: #d53f8c; --bg: #fff5f7; --text: #702459; }

    @media print {
      body { background: #fff; padding: 0; font-size: 10.5px; }
      .container { box-shadow: none; padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
      .page-break { page-break-before: always; break-before: page; }
      @page { size: A4 portrait; margin: 10mm 10mm; }

      .header-bar {
        border-bottom: 2px solid #2b4c7e;
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      .header-title h1 { font-size: 16px; margin: 0 0 2px; }
      .header-title p { font-size: 11px; margin: 0; }
      .header-meta { font-size: 11px; }

      .report-section { margin-bottom: 12px; }
      .section-heading {
        margin: 0 0 8px;
        padding-bottom: 4px;
        font-size: 13.5px;
      }

      .schedule-card-print {
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 14px;
        page-break-inside: auto;
        break-inside: auto;
      }
      .schedule-meta-bar { margin-bottom: 6px; gap: 6px; }
      .daily-breaks-list { margin: 4px 0 8px; font-size: 11px; gap: 4px; }
      .break-pill { padding: 1px 6px; font-size: 10px; }
      .badge { padding: 2px 6px; font-size: 10px; }

      .timetable-wrap {
        margin: 6px 0 10px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .print-week-header > span { padding: 5px 2px; font-size: 11px; }

      table.data-table {
        margin: 8px 0 4px;
        font-size: 10.5px;
        page-break-inside: auto;
        break-inside: auto;
      }
      table.data-table th { padding: 5px 6px; font-size: 10.5px; }
      table.data-table td { padding: 4px 6px; }
      table.data-table tr {
        page-break-inside: avoid;
        break-inside: avoid;
      }

      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="no-print">
      <div>
        <span style="font-weight:700;font-size:14px;">📄 معاينة التقرير للطباعة أو الحفظ كـ PDF</span>
        <div style="font-size:12px;color:#4a5568;margin-top:2px;">يمكنك اختيار "Save as PDF" من نافذة الطباعة لحفظ التقرير كملف PDF.</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn btn-primary" id="printReport">🖨️ طباعة الآن / حفظ كـ PDF</button>
        <button type="button" class="btn btn-secondary" id="closeReport">إغلاق</button>
      </div>
    </div>

    <header class="header-bar">
      <div class="header-title">
        <h1>الجامعة الهاشمية — Hashemite University</h1>
        <p>نظام الجداول الذكي — HU Smart Schedule</p>
      </div>
      <div class="header-meta">
        <div><b>الفصل:</b> <span id="metaTerm">—</span></div>
        <div><b>تاريخ التقرير:</b> <span id="metaDate">—</span></div>
        <div><b>نوع التقرير:</b> <span id="metaType">—</span></div>
      </div>
    </header>

    <div id="reportContent">
      <div style="text-align:center;padding:40px;color:#718096;">جاري تحميل بيانات التقرير...</div>
    </div>
  </div>

  <script src="export.js"></script>
</body>
</html>
